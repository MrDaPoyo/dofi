name: Build and Deploy WebAssembly

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git cmake build-essential python3 python3-pip nodejs npm

      - name: Install Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ~/emsdk
          cd ~/emsdk
          ./emsdk install latest
          ./emsdk activate latest

      - name: Clone raylib
        run: |
          git clone --branch master https://github.com/raysan5/raylib.git raylib

      - name: Compile Raylib for Web
        run: |
          # Source Emscripten in the same step
          source ~/emsdk/emsdk_env.sh
          cd raylib/src
          make clean
          make PLATFORM=PLATFORM_WEB RAYLIB_LIBTYPE=STATIC

      - name: Run build script
        run: |
          source ~/emsdk/emsdk_env.sh
          cd build_web
          chmod +x ./build-wasm.sh
          ./build-wasm.sh

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          cname: dofi.poy.ooo