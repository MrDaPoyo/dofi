name: Build and Deploy WebAssembly

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git cmake build-essential python3 python3-pip nodejs npm

      - name: Install Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ~/emsdk
          cd ~/emsdk
          ./emsdk install latest
          ./emsdk activate latest
          echo "EMSDK=$(realpath ~/emsdk)" >> $GITHUB_ENV
          echo "PATH=$(realpath ~/emsdk/upstream/emscripten):$PATH" >> $GITHUB_ENV

      - name: Clone raylib
        run: |
          git clone --branch master https://github.com/raysan5/raylib.git raylib

      - name: Compile Raylib for Web
        run: |
          source $EMSDK/emsdk_env.sh
          cd raylib/src
          make clean
          make PLATFORM=PLATFORM_WEB RAYLIB_LIBTYPE=STATIC

      - name: Run build script
        run: |
          source $EMSDK/emsdk_env.sh
          mkdir -p out
          mkdir -p build_web
          cd build_web
          chmod +x ./build-wasm.sh
          ./build-wasm.sh

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
